<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meus objetivos do ano</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <section class="conteudo-principal">
        <h1 class="titulo-principal">Meus objetivos do <span>ano</span></h1>

        <!-- Botões principais -->
        <div class="botoes">
            <button class="botao ativo">Curso de inglês</button>
            <button class="botao">Passar no ENEM</button>
            <button class="botao">Ingressar-me profissionalmente</button>
            <button class="botao">Currículo</button>
        </div>

        <!-- Conteúdo exibido para cada um dos 4 botões -->
        <div class="aba-conteudo">
            <!-- Botão 1: Curso de inglês -->
            <div class="conteudo-objetivo ativo">
                <h3>Objetivos para o Curso de inglês:</h3>
                <div class="caixas-inputs">
                    <input type="text" class="input-objetivo" value="Estudar uma hora por dia" readonly>
                    <input type="text" class="input-objetivo" value="Assistir filmes e séries legendadas" readonly>
                    <input type="text" class="input-objetivo" value="Praticar a conversação" readonly>
                </div>
            </div>

            <!-- Botão 2: Passar no ENEM -->
            <div class="conteudo-objetivo">
                <h3>Objetivos para Passar no ENEM:</h3>
                <div class="caixas-inputs">
                    <input type="text" class="input-objetivo" value="Estudar de três a quatro horas por dia" readonly>
                    <input type="text" class="input-objetivo" value="Fazer simulados" readonly>
                    <input type="text" class="input-objetivo" value="Praticar redação" readonly>
                </div>
            </div>

            <!-- Botão 3: Ingressar-me profissionalmente -->
            <div class="conteudo-objetivo">
                <h3>Objetivos para Ingressar-me profissionalmente:</h3>
                <div class="caixas-inputs">
                    <input type="text" class="input-objetivo" value="Arrumar um emprego onde me encaixe" readonly>
                    <input type="text" class="input-objetivo" value="Focar no meu futuro" readonly>
                </div>
            </div>

            <!-- Botão 4: Currículo (LinkedIn) -->
            <div class="conteudo-objetivo">
                <h3>Meu Perfil do LinkedIn:</h3>
                <p class="descricao-linkedin">Acesse meu perfil profissional através do link abaixo:</p>
                <div class="container-linkedin">
                    <input type="url" id="input-linkedin" class="input-objetivo" value="Cole o seu link aqui" readonly>
                    <a id="btn-linkedin" href="#" target="_blank" rel="noopener noreferrer" class="btn-abrir-link">Abrir Link</a>
                </div>
            </div>
        </div>
    </section>

    <script src="script.js"></script>
</body>

</html>
